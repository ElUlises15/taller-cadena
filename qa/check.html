<!doctype html><html><body><pre id="results">Checking</pre><iframe src="/" style="width:390px;height:844px;border:0"></iframe><script>
const frame=document.querySelector('iframe');frame.onload=async()=>{const d=frame.contentDocument;d.querySelectorAll("img").forEach(i=>i.loading="eager");const out=[];for(const width of [390,1280]){frame.style.width=width+'px';await new Promise(r=>setTimeout(r,100));out.push({width,documentWidth:d.documentElement.scrollWidth,viewport:d.documentElement.clientWidth,images:[...d.images].every(i=>i.complete&&i.naturalWidth>0),anchors:[...d.querySelectorAll('a[href^="#"]')].every(a=>a.hash===''||d.querySelector(a.hash)),gearTeeth:d.querySelector('#teeth').children.length,robots:d.querySelector('meta[name="robots"]').content});}document.querySelector('#results').textContent=JSON.stringify(out);};
</script></body></html>
